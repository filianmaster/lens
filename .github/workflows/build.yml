
name: Build Lens EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 mss pillow winocr deep-translator pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name Lens `
            --collect-all winocr `
            --collect-all winrt `
            --collect-all PySide6 `
            --collect-all mss `
            --collect-all PIL `
            lens.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Lens-Windows-EXE
          path: dist/Lens.exe
